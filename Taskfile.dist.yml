version: '3'

vars:
  SERVICE_URL: http://localhost:8080
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASS: "fake"

env:
  BLANKPAGE_AUTHENTICATION_EMAIL: "{{ .ADMIN_EMAIL }}"
  BLANKPAGE_AUTHENTICATION_PASSWORD: "{{ .ADMIN_PASS }}"


tasks:
  protos:
    desc: generate protobuf shapes
    cmds:
    - uv run --with betterproto2_compiler==0.9.0 buf generate

  server:
    desc: run server locally
    cmds:
    - mkdir -p ./cmd/server/dist
    - echo "<p>This is a debug server build</p>" > ./cmd/server/dist/index.html
    - CGO_ENABLED=0 go build -o server ./cmd/server 
    - task: _run

  server-production:
    desc: run a production server locally
    cmds:
    - task: build-production-server
    - task: _run

  _run:
    internal: true
    env:
      LOG_LEVEL: debug
      LOG_FORMAT: human
      PURGE_ENABLED: T
      INITIAL_ADMIN_PASSWORD: '{{ .ADMIN_PASS }}'
      STORAGE_TYPE: postgres
      POSTGRES_DATABASE_USER: blankpage_usr
      POSTGRES_DATABASE_PASSWORD: some-password
      POSTGRES_DATABASE_HOST: localhost
      POSTGRES_DATABASE_NAME: blankpage
    cmds:
    - ./server

  cli:
    desc: build cli
    cmds:
    - CGO_ENABLED=0 go build -o blankpage ./cmd/cli

  functional-tests:
    desc: run functional tests against a local instance
    dir: ./functional-tests
    env:
      BLANKPAGE_URL: "http://localhost:8080"
    cmds:
    - uv run pytest -rF -v {{ .CLI_ARGS }}

  seed-admin-roles:
    desc: seed the admin user with all the roles for basic testing
    cmds:
    - uv run hack/admin_role_seed.py

  migration:
    desc: create a new migration
    cmds:
    - migrate create -ext sql -dir internal/storage/postgres-migrations {{ .CLI_ARGS }}
    - migrate create -ext sql -dir internal/pauth/storage/postgres-migrations {{ .CLI_ARGS }}

  postgres:
    desc: start postgres container for bench testing with postgres storage backend
    cmds:
    - docker compose up -d --wait postgres

  psql:
    desc: connect to docker postgres for debugging
    cmds:
    - PGPASSWORD=some-password psql -h localhost -U blankpage_usr blankpage

  bootstrap:
    desc: prepare a local service for bench testing
    cmds:
    - task: cli
    - task: purge
    - task: seed-admin-roles
    - mkdir -p seed-books
    - task: sample-books

  purge:
    desc: purge a local service
    cmds:
    - ./blankpage --server-url {{ .SERVICE_URL }} purge

  sample-books:
    desc: download some sample books from project gutenberg & seed them into the service
    cmds:
    - task: fetch-and-upload
      vars:
        BOOK: 84.epub3.images
        TITLE: Frankenstein
        AUTHOR: Mary Shelly
    - task: fetch-and-upload
      vars:
        BOOK: 2701.epub3.images
        TITLE: Moby Dick
        AUTHOR: Herman Melville
    - task: fetch-and-upload
      vars:
        BOOK: 1342.epub3.images
        TITLE: Pride & Prejudice
        AUTHOR: Jane Austen
    - task: fetch-and-upload
      vars:
        BOOK: 1513.epub3.images
        TITLE: Romeo & Juliet
        AUTHOR: William Shakespeare
    - task: fetch-and-upload
      vars:
        BOOK: 64317.epub3.images
        TITLE: The Great Gatsby
        AUTHOR: F. Scott Fitzgerald
    - task: fetch-and-upload
      vars:
        BOOK: 1661.epub3.images
        TITLE: The Adventures of Sherlock Holmes
        AUTHOR: Arthur Conan Doyle
    - task: fetch-and-upload
      vars:
        BOOK: 120.epub3.images
        TITLE: Treasure Island
        AUTHOR: Robert Louis Stevenson

  fetch-and-upload:
    internal: true
    cmds:
    - task: fetch-book
      vars:
        BOOK: '{{ .BOOK }}'
    - ./blankpage add-book --server-url {{ .SERVICE_URL }} --title "{{ .TITLE }}" --author "{{ .AUTHOR }}" --no-interactive seed-books/{{ .BOOK }}


  fetch-book:
    internal: true
    cmds:
    - wget -O seed-books/{{ .BOOK }} https://www.gutenberg.org/ebooks/{{ .BOOK }}
    status:
    - test -f seed-books/{{ .BOOK }}

  build-production-server:
    desc: build a production server binary with the UI bundled in
    cmds:
    - task: build-production-ui
    - rm -rf ./cmd/server/dist
    - mkdir -p ./cmd/server/dist
    - cp -r ./ui/dist/* ./cmd/server/dist/.
    - CGO_ENABLED=0 go build -o server ./cmd/server 

  build-production-ui:
    internal: true
    dir: ./ui
    cmds:
    - bun run build

  sync-ignores:
    desc: sync dockerignore with gitignore
    cmds:
    - uv run --with generate-dockerignore-from-gitignore==0.1.3 generate-dockerignore
