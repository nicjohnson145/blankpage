version: '3'

env:
  BLANKPAGE_AUTHENTICATION_EMAIL: "admin@example.com"
  BLANKPAGE_AUTHENTICATION_PASSWORD: "fake-admin-password"

vars:
  SERVICE_URL: http://localhost:8080

tasks:
  protos:
    desc: generate protobuf shapes
    cmds:
    - uv run --with betterproto2_compiler==0.9.0 buf generate

  server:
    desc: run server locally
    env:
      LOG_LEVEL: debug
      LOG_FORMAT: human
      PURGE_ENABLED: T
      INITIAL_ADMIN_PASSWORD: "fake-admin-password"
      STORAGE_TYPE: postgres
      POSTGRES_DATABASE_USER: blankpage_usr
      POSTGRES_DATABASE_PASSWORD: some-password
      POSTGRES_DATABASE_HOST: localhost
      POSTGRES_DATABASE_NAME: blankpage
    cmds:
    - CGO_ENABLED=0 go build -o server ./cmd/server 
    - ./server

  cli:
    desc: build cli
    cmds:
    - CGO_ENABLED=0 go build -o blankpage ./cmd/cli

  functional-tests:
    desc: run functional tests against a local instance
    dir: ./functional-tests
    env:
      BLANKPAGE_URL: "http://localhost:8080"
    cmds:
    - uv run pytest -rF -v {{ .CLI_ARGS }}

  seed-admin-roles:
    desc: seed the admin user with all the roles for basic testing
    cmds:
    - uv run hack/admin_role_seed.py

  migration:
    desc: create a new migration
    cmds:
    - migrate create -ext sql -dir internal/storage/postgres-migrations {{ .CLI_ARGS }}
    - migrate create -ext sql -dir internal/pauth/storage/postgres-migrations {{ .CLI_ARGS }}

  postgres:
    desc: start postgres container for bench testing with postgres storage backend
    cmds:
    - docker compose up -d --wait postgres

  psql:
    desc: connect to docker postgres for debugging
    cmds:
    - PGPASSWORD=some-password psql -h localhost -U blankpage_usr blankpage

  bootstrap:
    desc: prepare a local service for bench testing
    cmds:
    - task: purge
    - task: seed-admin-roles
    - task: sample-books

  purge:
    desc: purge a local service
    cmds:
    - ./blankpage --server-url {{ .SERVICE_URL }} purge

  sample-books:
    desc: download some sample books from project gutenberg & seed them into the service
    cmds:
    - task: cli
    # frankenstein
    - task: fetch-book
      vars:
        BOOK: 84.epub3.images
    - ./blankpage add-book --server-url {{ .SERVICE_URL }} --title "Frankenstein" --author "Mary Shelly" --no-interactive seed-books/84.epub3.images
    # moby dick
    - task: fetch-book
      vars:
        BOOK: 2701.epub3.images
    - ./blankpage add-book --server-url {{ .SERVICE_URL }} --title "Moby Dick" --author "Herman Melville" --no-interactive seed-books/2701.epub3.images
    # pride and prejudice
    - task: fetch-book
      vars:
        BOOK: 1342.epub3.images
    - ./blankpage add-book --server-url {{ .SERVICE_URL }} --title "Pride & Prejudice" --author "Jane Austen" --no-interactive seed-books/1342.epub3.images
    # romeo & juliet
    - task: fetch-book
      vars:
        BOOK: 1513.epub3.images
    - ./blankpage add-book --server-url {{ .SERVICE_URL }} --title "Romeo & Juliet" --author "William Shakespeare" --no-interactive seed-books/1513.epub3.images

  fetch-book:
    internal: true
    cmds:
    - wget -O seed-books/{{ .BOOK }} https://www.gutenberg.org/ebooks/{{ .BOOK }}
    status:
    - test -f seed-books/{{ .BOOK }}
