services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=blankpage
      - POSTGRES_PASSWORD=some-password
      - POSTGRES_USER=blankpage_usr
    ports:
    - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      timeout: 1s
      start_period: 10s
      start_interval: 2s
    volumes:
    - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: {}